<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0F1220"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="scanMask">
      <rect x="0" y="0" width="1200" height="420" fill="black"/>
      <rect x="0" y="0" width="1200" height="4" fill="white">
        <animate attributeName="y" values="0;420" dur="6s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- circuit lines -->
  <g stroke="#A855F7" stroke-opacity="0.15" fill="none" stroke-width="1">
    <path d="M0 200 H400 M400 200 V300 M600 100 H1200"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- neural nodes -->
  <g filter="url(#glow)">
    <circle cx="200" cy="180" r="6" fill="#A855F7">
      <animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="240" r="5" fill="#22D3EE">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="450" cy="160" r="5" fill="#F472B6">
      <animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <!-- connections -->
    <line x1="200" y1="180" x2="300" y2="240" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="300" y1="240" x2="450" y2="160" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- floating particles -->
  <g opacity="0.6">
    <circle cx="800" cy="120" r="2" fill="#22D3EE">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -20;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="200" r="2" fill="#A855F7">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 15;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="280" r="2" fill="#F472B6">
      <animateTransform attributeName="transform" type="translate" values="0 0;15 10;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal window -->
  <rect x="80" y="140" width="1040" height="180" rx="16" fill="#151126" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="80" y="140" width="1040" height="180" rx="16" fill="none" stroke="#C084FC" stroke-opacity="0.1" stroke-width="2"/>

  <!-- text -->
  <text x="120" y="200" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="url(#textGrad)">Hi, I'm Harshan Seliyan 👋</text>
  <text x="120" y="250" font-family="Consolas, monospace" font-size="20" fill="#F8FAFC">AI / ML Developer | Software Developer</text>
  <text x="120" y="290" font-family="Consolas, monospace" font-size="16" fill="#94A3B8">Building intelligent systems for real-world problems.</text>

  <!-- cursor -->
  <rect x="520" y="230" width="2" height="22" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scan line overlay -->
  <rect width="1200" height="420" fill="#22D3EE" opacity="0.04" mask="url(#scanMask)"/>
</svg>
