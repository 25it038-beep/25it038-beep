<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="600">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#080B12"/>
  <g font-family="Consolas,monospace" font-size="16" fill="#F8FAFC" text-anchor="middle">
    <rect x="520" y="20" width="160" height="50" rx="12" fill="#151126" stroke="#A855F7" stroke-opacity="0.5"/>
    <text x="600" y="52">EMAIL</text>
    <rect x="520" y="110" width="160" height="50" rx="12" fill="#151126" stroke="#C084FC" stroke-opacity="0.5"/>
    <text x="600" y="142">HEADER ANALYSIS</text>
    <rect x="520" y="200" width="160" height="50" rx="12" fill="#151126" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="600" y="232">SPF / DKIM / DMARC</text>
    <rect x="520" y="290" width="160" height="50" rx="12" fill="#151126" stroke="#F472B6" stroke-opacity="0.5"/>
    <text x="600" y="322">IP EXTRACTION</text>
    <rect x="520" y="380" width="160" height="50" rx="12" fill="#151126" stroke="#4ADE80" stroke-opacity="0.5"/>
    <text x="600" y="412">DNS / RDAP / GEOLOCATION</text>
    <rect x="520" y="470" width="160" height="50" rx="12" fill="#151126" stroke="#A855F7" stroke-opacity="0.5"/>
    <text x="600" y="502">THREAT INTELLIGENCE</text>
    <rect x="520" y="540" width="160" height="50" rx="12" fill="#151126" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="600" y="572">AI + RULE ENGINE → THREAT SCORE</text>
  </g>
  <g stroke="url(#pipeGrad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.4">
    <line x1="600" y1="70" x2="600" y2="110"/>
    <line x1="600" y1="160" x2="600" y2="200"/>
    <line x1="600" y1="250" x2="600" y2="290"/>
    <line x1="600" y1="340" x2="600" y2="380"/>
    <line x1="600" y1="430" x2="600" y2="470"/>
    <line x1="600" y1="520" x2="600" y2="540"/>
    <animate attributeName="stroke-dashoffset" values="0;8" dur="2s" repeatCount="indefinite"/>
  </g>
  <circle cx="600" cy="45" r="8" fill="#22D3EE" filter="url(#glow3)">
    <animate attributeName="cy" values="45;85;125;185;275;365;455;545" keyTimes="0;0.15;0.3;0.45;0.6;0.75;0.9;1" dur="12s" repeatCount="indefinite"/>
